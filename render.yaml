services:
  # 1. Python FastAPI Backend Web Service
  - type: web
    name: techzephyr-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Vite React + Three.js Frontend Static Site (Global CDN)
  - type: web
    name: techzephyr-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://techzephyr-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
